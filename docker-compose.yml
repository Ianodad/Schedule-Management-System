version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: schedule-postgres
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: schedule_user
      POSTGRES_PASSWORD: schedule_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule_user -d schedule_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: schedule-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: schedule_db
      DB_USER: schedule_user
      DB_PASSWORD: schedule_password
      GRPC_PORT: "50051"
    ports:
      - "50051:50051"

  envoy:
    build:
      context: ./envoy
      dockerfile: Dockerfile
    container_name: schedule-envoy
    depends_on:
      - server
    ports:
      - "8080:8080"
      - "9901:9901"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: schedule-client
    environment:
      VITE_GRPC_BASE_URL: http://localhost:8080
    depends_on:
      - envoy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
